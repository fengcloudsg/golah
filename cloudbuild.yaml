# Build GoLah! image for Cloud Run (Singapore). Deploy is done by deploy-cloud-run.ps1
# so the local gcloud user has Run Admin (Cloud Build SA often does not yet).
# gcloud builds submit --config cloudbuild.yaml --substitutions=_MAPS_KEY=YOUR_KEY,_IMAGE_TAG=ts
substitutions:
  _REGION: asia-southeast1
  _SERVICE: golah
  _MAPS_KEY: ""
  _API_BASE: ""
  _ADSENSE_CLIENT: "ca-pub-6244756659144944"
  _IMAGE_TAG: latest

timeout: 1800s

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/golah/${_SERVICE}:${_IMAGE_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/golah/${_SERVICE}:latest
      - --build-arg
      - VITE_GOOGLE_MAPS_API_KEY=${_MAPS_KEY}
      - --build-arg
      - VITE_API_BASE=${_API_BASE}
      - --build-arg
      - VITE_ADSENSE_CLIENT=${_ADSENSE_CLIENT}
      - .

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/golah/${_SERVICE}:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/golah/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
